name: Android APK

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Cihazda build için paketlenecek Flasher_Builder deposu (git URL)"
        required: false
        default: "https://github.com/koaaN/Flasher_Builder.git"
      source_ref:
        description: "Branch / tag"
        required: false
        default: "main"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_REPO: ${{ inputs.source_repo || 'https://github.com/koaaN/Flasher_Builder.git' }}
      SOURCE_REF: ${{ inputs.source_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4

      # Chaquopy, uygulamanın Python sürümüyle (3.12) aynı Python'u derleme makinesinde ister.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ARM64 araçlarını getir (SHA-256 doğrulamalı)
        run: bash tools/fetch_arm64_tools.sh

      - name: Flasher_Builder kaynağını paketle (cihazda build için)
        run: python tools/bundle_repo.py --repo "$SOURCE_REPO" --ref "$SOURCE_REF"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # İsteğe bağlı kalıcı imza: KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD secret'ları.
      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FlasherBuilder-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
